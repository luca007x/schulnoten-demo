enheitsfilter"><button data-filter="all" class="${ui.filter==='all'?'active':''}">Alle (${su.length})</button><button data-filter="present" class="${ui.filter==='present'?'active':''}">Anwesend</button><button data-filter="absent" class="${ui.filter==='absent'?'active':''}">Abwesend</button></div><div class="field student-search" style="flex:1 1 165px"><label for="search-student">Schüler suchen</label><input id="search-student" data-control="search" type="search" value="${esc(ui.search)}" placeholder="Kürzel eingeben…"></div></div>${displayed.length?(ui.view==='tiles'?`<div class="lesson-grid">${displayed.map(s=>studentTile(s,l)).join('')}</div>`:`<div class="table-scroll"><table class="fancy-table"><thead><tr><th>Kürzel</th><th>Anwesenheit</th><th>Note / Punkte</th><th>Herkunft</th><th>Aktion</th></tr></thead><tbody>${displayed.map(s=>{const g=getGrade(l.id,s.id);return `<tr><td><b>${esc(s.code)}</b></td><td><button class="button smallbtn" data-cycle-att="${s.id}">${attendanceName(getAtt(l.id,s.id))}</button></td><td>${g?`<button class="grade-btn" data-choose-grade="${s.id}">${displayGrade(g.value,clsSys)} ${ico('note',12)}</button>`:'–'}</td><td>${g?.source==='MANUAL'?'<span class="pill blue">Manuell</span>':g?'<span class="pill">Standard</span>':'<span class="pill amber">Abwesend</span>'}</td><td><button class="button smallbtn" data-note="${s.id}">${ico('note',14)} Notiz</button></td></tr>`}).join('')}</tbody></table></div>`):`<div class="empty">${ico('search',29)}<p>Für diesen Filter gibt es keine Schüler:innen.</p></div>`}<div class="subnav"><button data-page="assessments">+ Zusatzleistung zu dieser Unterrichtseinheit</button><button data-page="reports">Notenübersicht ansehen ${ico('arrow',13)}</button></div></div>`:`<div class="card"><div class="empty">${ico('book',27)}<p>Für dieses Fach gibt es noch keine Unterrichtseinheit.</p><button class="button primary" data-modal="new-lesson">Erste Einheit anlegen</button></div></div>`}`}
const typeLabels={LESSON:'Unterricht',EXAM:'Klassenarbeit / Klausur',PRESENTATION:'Präsentation',TEST:'Kurztest',ORAL:'Mündliche Zusatzleistung'};
function renderAssessments(){const arr=data.assessments.filter(x=>x.subjectId===ui.subjectId).sort((a,b)=>b.date.localeCompare(a.date));return `${header('Leistungsnachweise','Präsentationen, Kurztests, Klassenarbeiten und zusätzliche Noten.',`<button class="button primary" data-modal="new-assessment">${ico('plus',17)} Zusatzleistung</button>`)}${contextControls(false)}<div class="dash-grid"><div class="card"><div class="card-head"><h2>Erfasste Zusatzleistungen</h2><span class="pill">${arr.length} Einträge</span></div>${arr.length?arr.map(a=>{const vals=Object.values(a.values).filter(Number.isInteger),average=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null;return `<div class="assessment-item"><div class="row"><div class="assessment-icon">${ico(a.type==='EXAM'?'file':'clipboard',21)}</div><div><strong>${esc(a.title)}</strong><p>${esc(typeLabels[a.type]||a.type)} · ${niceDate(a.date)} · ${vals.length} bewertet ${a.groupMode?'· Gruppe':''}</p></div></div><div class="assessment-right"><strong>${avgFormat(average)}</strong><button class="linkbtn" data-edit-assessment="${a.id}">Bearbeiten ${ico('arrow',13)}</button></div></div>`}).join(''):`<div class="empty">${ico('clipboard',28)}<p>Für dieses Fach sind noch keine zusätzlichen Leistungen erfasst.</p></div>`}<div class="notice" style="margin-top:15px">Nicht bewertete Schüler:innen fließen nicht in den Durchschnitt ein. Mehrere Bewertungen derselben Leistungsart zählen gleich stark.</div></div><div style="display:grid;gap:19px;align-content:start"><div class="card"><div class="card-head"><h2>So funktioniert es</h2></div><div class="logrow"><div class="logicon">1</div><div><strong>Leistungsart auswählen</strong><p>Kurztest, Klassenarbeit, Präsentation oder eigene Leistungsart.</p></div></div><div class="logrow"><div class="logicon">2</div><div><strong>Schüler:innen bewerten</strong><p>Mit „Noch nicht bewertet“ beginnen oder eine Startnote verwenden.</p></div></div><div class="logrow"><div class="logicon">3</div><div><strong>Durchschnitt prüfen</strong><p>Zusatzleistungen erscheinen mit ihrer fachlichen Gewichtung in der Auswertung.</p></div></div></div><div class="callout"><div class="callout-icon">${ico('users',22)}</div><div><strong>Gruppenpräsentation</strong><p>Vergib eine gemeinsame Ausgangsnote und passe anschließend einzelne Gruppenmitglieder an.</p><button class="button smallbtn" data-modal="new-assessment">Gruppe erstellen ${ico('arrow',13)}</button></div></div></div></div>`}
function gradeLinePath(studentId,subjectId){const points=lessonsFor(subjectId).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(l=>getGrade(l.id,studentId)).filter(Boolean).map(g=>g.value);if(points.length<2)return `<div class="muted small">Noch keine Zeitreihe</div>`;const c=cls(sub(subjectId).classId),range=limits(c.system);const p=points.map((v,i)=>{const x=12+i*180/Math.max(1,points.length-1);const y=14+(v-range.min)/(range.max-range.min)*72;return [x,c.system==='GRADES'?y:100-y]});return `<svg class="chartbox" style="height:110px" viewBox="0 0 210 115" aria-label="Verlauf einzelner Unterrichtsbewertungen"><path d="M12 15H196M12 57H196M12 100H196" stroke="#edf2f9" stroke-width="1"/><polyline points="${p.map(pt=>pt.join(',')).join(' ')}" fill="none" stroke="#4677eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${p.map(pt=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="4.5" fill="#4677eb" stroke="#fff" stroke-width="2"/>`).join('')}</svg>`}
function renderReports(){const su=studentsFor(ui.classId),selected=su.find(x=>x.id===ui.reportStudent)||su[0];const stats=su.map(st=>({st,agg:calcStudent(st.id,ui.subjectId)}));const averages=stats.map(x=>x.agg.avg).filter(Number.isFinite);const mean=averages.length?averages.reduce((a,b)=>a+b,0)/averages.length:null;const evalCount=stats.reduce((a,b)=>a+b.agg.lessons+b.agg.assessments,0);const reviewCount=stats.filter(x=>!x.agg.complete).length;return `${header('Auswertungen','Halbjahresnoten und Leistungsentwicklung im Überblick.',`<button class="button" data-view-audit="1">${ico('clock',16)} Änderungshistorie</button>`)}${contextControls(false)}<div class="metrics">${metric('Klassendurchschnitt',avgFormat(mean),'Vorläufig berechnet','chart')}${metric('Erfasste Leistungen',evalCount,'Unterricht & Zusatznoten','clipboard')}${metric('Schüler:innen',su.length,'Im ausgewählten Fach','users')}${metric('Unvollständige Noten',reviewCount,'Gewichtungen berücksichtigen','warning')}</div><div class="dash-grid"><div class="card"><div class="card-head"><h2>Halbjahresübersicht</h2><span class="pill blue">1. Halbjahr 2026/27</span></div><div class="table-scroll"><table class="fancy-table"><thead><tr><th>Schüler</th><th>Durchschnitt</th><th>Unterricht</th><th>Zusatz</th><th>Status</th><th>Endnote</th></tr></thead><tbody>${stats.map(({st,agg})=>{const fin=data.finals[ui.subjectId+':'+st.id];return `<tr><td><button class="linkbtn" data-report-student="${st.id}">${esc(st.code)}</button></td><td><b>${avgFormat(agg.avg)}</b></td><td>${agg.lessons}</td><td>${agg.assessments}</td><td><span class="pill ${agg.complete?'green':'amber'}">${agg.complete?'Vollständig':'Vorläufig'}</span></td><td><button class="button smallbtn" data-final-student="${st.id}">${fin!=null?displayGrade(fin):'+ Festlegen'}</button></td></tr>`}).join('')}</tbody></table></div><p class="footnote" style="margin:12px 0 0">Zwischenergebnisse werden nicht gerundet. Endnoten werden ausschließlich manuell festgelegt.</p></div><div style="display:grid;gap:19px;align-content:start"><div class="card"><div class="card-head"><h2>Schülerdetails</h2><span class="pill">${esc(selected?.code||'')}</span></div>${selected?(()=>{const a=calcStudent(selected.id,ui.subjectId);return `<div class="row between" style="margin:15px 0"><div><div class="kpi-caption">Gewichteter Durchschnitt</div><div class="metric-value" style="font-size:34px">${avgFormat(a.avg)}</div></div><div class="pill ${a.complete?'green':'amber'}">${a.complete?'Vollständig':'Vorläufig'}</div></div>${gradeLinePath(selected.id,ui.subjectId)}<div class="setting-row"><span class="muted text-sm">Unterrichtseinheiten</span><b>${a.lessons}</b></div><div class="setting-row"><span class="muted text-sm">Zusatzleistungen</span><b>${a.assessments}</b></div><div class="setting-row"><span class="muted text-sm">Automatische Standardnoten</span><b>${a.automatic}</b></div>${a.missing.length?`<div class="notice warning" style="margin-top:15px">Noch ohne Bewertung: ${a.missing.map(x=>typeLabels[x]||x).join(', ')}. Fehlende Kategorien zählen nicht als Note 0.</div>`:''}`})():''}</div><div class="card"><div class="card-head"><h2>Fachgewichtungen</h2><button class="linkbtn" data-page="settings">Einstellungen ${ico('arrow',13)}</button></div>${Object.entries(subject()?.weights||{}).filter(([k,w])=>w>0).map(([k,w])=>`<div style="margin-bottom:15px"><div class="row between text-sm" style="margin-bottom:7px"><span>${esc(typeLabels[k]||k)}</span><b>${w} %</b></div><div class="progress"><b style="width:${w}%"></b></div></div>`).join('')}</div></div></div>`}
function renderBackups(){return `${header('Datensicherung','Sicherer lokaler Schutz und portabler Export in der späteren iPad-App.')}<div class="notice warning" style="margin-bottom:19px"><b>Entwurfsansicht:</b> Weder verschlüsselte iPad-Backups noch der passwortgeschützte JSON-Export sind in diesem Click-Dummy implementiert. Alle produktiven Schaltflächen sind deshalb deaktiviert.</div><div class="grid-classes"><div class="card"><div class="card-head"><h2>Automatische Gerätesicherung</h2><span class="pill amber">Nicht implementiert</span></div><div class="large-placeholder">${ico('lock',36)}<h3>Verschlüsselte lokale Sicherungen</h3><p>Geplant: Sicherung beim App-Start nach Ablauf des Intervalls, maximal drei gültige Generationen, SQLCipher-Verschlüsselung und Konsistenzprüfung.</p><button class="button" disabled>${ico('cloud',16)} Sicherung erstellen</button></div><div class="setting-row"><div><strong>Backup-Intervall</strong><p>Vorgabe: 7 Tage</p></div><span class="pill">7 Tage</span></div><div class="setting-row"><div><strong>Gespeicherte Sicherungen</strong><p>Keine nativen Backups im Click-Dummy</p></div><span class="pill amber">0 / 3</span></div></div><div class="card"><div class="card-head"><h2>Portabler JSON-Export</h2><span class="pill amber">Nicht implementiert</span></div><div class="large-placeholder">${ico('file',36)}<h3>Verschlüsselte Übertragung zwischen Geräten</h3><p>Geplant: Passwort mit sicherer Schlüsselableitung, AES-256-GCM, verifiziertes Exportformat und konfliktbewusster Import.</p><button class="button" disabled>${ico('download',16)} Verschlüsselte JSON-Datei</button></div><div class="setting-row"><div><strong>CSV-Export</strong><p>In der Produktiv-App nur mit expliziter Datenschutzwarnung.</p></div><span class="pill">Geplant</span></div></div></div>`}
function renderSettings(){const su=subject();return `${header('Einstellungen','Klassenkonfiguration, Notenregeln und Demonstrationsdaten.')}<div class="dash-grid"><div class="card"><div class="card-head"><h2>Noten & Gewichtungen</h2><span class="pill blue">Demo</span></div>${contextControls(false)}<div class="setting-row"><div><strong>Notensystem</strong><p>Einheitlich für die ausgewählte Klasse</p></div><span class="pill">${system()==='GRADES'?'1 bis 6':'0 bis 15 Punkte'}</span></div><div class="setting-row"><div><strong>Standardbewertung</strong><p>Wird beim Anlegen einer Unterrichtseinheit verwendet</p></div><div style="width:92px" class="field"><select data-control="default-grade" aria-label="Standardnote">${Array.from({length:limits(system()).max-limits(system()).min+1},(_,i)=>i+limits(system()).min).map(n=>`<option value="${n}" ${su?.defaultGrade===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="setting-row"><div><strong>Gewichtung</strong><p>Unterricht, Klausuren, Präsentationen und Tests (in Prozent)</p></div><button class="button smallbtn" data-modal="weighting">Bearbeiten ${ico('note',13)}</button></div><div class="notice" style="margin-top:16px">Änderungen an Gewichtungen setzen bestehende manuelle Endnoten zurück. Frühere Endnoten bleiben in der lokalen Demo-Historie protokolliert.</div></div><div style="display:grid;gap:19px;align-content:start"><div class="card"><div class="card-head"><h2>Datenschutz & Betrieb</h2>${ico('shield',20)}</div><div class="setting-row"><div><strong>Keine Netzwerkanfragen</strong><p>Standalone-Datei ohne externe Ressourcen</p></div><span class="pill green">Demo offline</span></div><div class="setting-row"><div><strong>Schülerdaten</strong><p>Alle Kürzel und Leistungswerte sind erfunden</p></div><span class="pill green">Fiktiv</span></div><div class="setting-row"><div><strong>Lokaler Browser-Speicher</strong><p>Nicht verschlüsselt und nicht für Echtdaten geeignet</p></div><span class="pill amber">Nur Demo</span></div></div><div class="card"><div class="card-head"><h2>Demodaten verwalten</h2></div><p class="subtitle" style="margin-bottom:15px">Du kannst alle Bewertungen frei testen. Hier lässt sich der ursprüngliche Beispielzustand jederzeit wiederherstellen.</p><button class="button danger" data-reset="1">${ico('undo',16)} Demo zurücksetzen</button></div></div></div>`}
function modalContent(){const mode=ui.modal;let title='',body='',footer='',wide='';const close=`<button class="icon-button" data-close="1" aria-label="Schließen">${ico('close',18)}</button>`;const btnCancel=`<button class="button" data-close="1">Abbrechen</button>`;
 if(mode==='new-lesson'){title='Unterrichtseinheit starten';body=`<div class="fields"><div class="field"><label>Klasse</label><select id="modal-class">${data.classes.map(c=>`<option value="${c.id}" ${ui.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Fach / Lernfeld</label><select id="modal-subject">${data.subjects.filter(s=>s.classId===ui.classId).map(s=>`<option value="${s.id}" ${ui.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div><div class="field"><label>Titel</label><input id="modal-title" value="Neue Unterrichtseinheit" maxlength="100"></div><div class="fields"><div class="field"><label>Datum</label><input type="date" id="modal-date" value="${DAY}"></div><div class="field"><label>Dauer in Minuten</label><input type="number" id="modal-duration" value="90" min="1" max="600"></div><div class="field"><label>Standardnote / -punkte</label><input type="number" id="modal-default" value="${subject()?.defaultGrade??3}" min="${limits(system()).min}" max="${limits(system()).max}"></div></div><div class="notice">Beim Start erhalten alle aktiven Schüler:innen automatisch „Anwesend“ und die Standardbewertung. Du kannst beides sofort ändern.</div>`;footer=btnCancel+`<button class="button primary" data-submit="new-lesson">${ico('plus',16)} Unterricht starten</button>`}
 else if(mode==='new-student'){title='Schüler hinzufügen';body=`<div class="field"><label>Klasse</label><select id="modal-class">${data.classes.map(c=>`<option value="${c.id}" ${ui.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Fiktives Schülerkürzel</label><input id="modal-code" maxlength="40" placeholder="z. B. DEMO-26"></div><div class="notice">Keine Klarnamen eingeben. Die Schüler-ID wird unveränderlich erzeugt, das Kürzel kann sich ändern.</div>`;footer=btnCancel+`<button class="button primary" data-submit="new-student">${ico('plus',16)} Hinzufügen</button>`}
 else if(mode==='attendance'){const st=data.students.find(s=>s.id===ui.selectedStudent);title='Anwesenheit · '+esc(st?.code||'');body=`<p class="modal-nudge">Wähle den Status für die aktuelle Unterrichtseinheit.</p>${[['PRESENT','Anwesend','green'],['ABSENT_EXCUSED','Entschuldigt abwesend','amber'],['ABSENT_UNEXCUSED','Unentschuldigt abwesend','red']].map(([val,label,tone])=>`<button class="button" style="justify-content:space-between;width:100%;margin-bottom:4px" data-select-att="${val}">${esc(label)} ${getAtt(ui.lessonId,ui.selectedStudent)===val?ico('check',17):''}</button>`).join('')}<div class="notice warning">Bei Abwesenheit entfällt die aktive Unterrichtsnote. Beim Wechsel zurück zu „Anwesend“ wird die Standardnote dieser Einheit neu vergeben.</div>`;footer=btnCancel}
 else if(mode==='grade'){const st=data.students.find(s=>s.id===ui.selectedStudent);title='Note ändern · '+esc(st?.code||'');const range=limits(system()),curr=getGrade(ui.lessonId,st.id)?.value;body=`<p class="modal-nudge">Die Bewertungsrichtung hängt vom Notensystem der Klasse ab.</p><div class="row wrap" style="gap:8px">${Array.from({length:range.max-range.min+1},(_,i)=>i+range.min).map(n=>`<button class="grade-btn ${n===curr?'selected':''}" data-set-grade="${n}">${n}</button>`).join('')}</div>`;footer=btnCancel}
 else if(mode==='note'){const st=data.students.find(x=>x.id===ui.selectedStudent);title='Notiz · '+esc(st?.code||'');const text=getGrade(ui.lessonId,st.id)?.note||data.notes[notesKey(ui.lessonId,st.id)]||'';body=`<div class="field"><label>Individuelle Notiz zur Unterrichtseinheit</label><textarea id="modal-note" maxlength="2000" placeholder="Beobachtungen ergänzen…">${esc(text)}</textarea></div><div class="notice">Auch Notizen sind im Produktivsystem sensible Daten. Dieser Click-Dummy nutzt ausschließlich synthetische Eingaben.</div>`;footer=btnCancel+`<button class="button primary" data-submit="note">${ico('check',15)} Speichern</button>`}
 else if(mode==='new-assessment'){title='Zusatzleistung erfassen';wide=' wide';const l=activeLesson(),su=studentsFor(ui.classId);body=`<div class="fields"><div class="field"><label>Art der Leistung</label><select id="modal-type"><option value="PRESENTATION">Präsentation</option><option value="EXAM">Klassenarbeit / Klausur</option><option value="TEST">Kurztest</option><option value="ORAL">Mündliche Zusatzleistung</option></select></div><div class="field"><label>Zugehöriger Unterricht</label><select id="modal-lesson">${lessonsFor(ui.subjectId).map(x=>`<option value="${x.id}" ${x.id===ui.lessonId?'selected':''}>${niceDate(x.date)} · ${esc(x.title)}</option>`).join('')}</select></div></div><div class="field"><label>Titel</label><input id="modal-title" value="Neue Präsentation" maxlength="120"></div><div class="fields"><div class="field"><label>Bewertungsmodus</label><select id="modal-ass-mode"><option value="unrated">Noch nicht bewertet (Standard)</option><option value="all">Startnote für alle Teilnehmer</option><option value="group">Gruppennote für alle Teilnehmer</option></select></div><div class="field"><label>Startnote / Gruppen-Ausgangsnote</label><input id="modal-ass-grade" type="number" value="${subject()?.defaultGrade??3}" min="${limits(system()).min}" max="${limits(system()).max}"></div></div><div class="row between"><strong class="text-sm">Teilnehmende Schüler:innen</strong><span class="pill">${su.length} ausgewählt</span></div><div class="row wrap" style="gap:7px;max-height:180px;overflow:auto;padding:3px">${su.map(st=>`<label class="pill" style="padding:8px 11px"><input type="checkbox" class="ass-student" value="${st.id}" checked> ${esc(st.code)}</label>`).join('')}</div><div class="notice">Bei Gruppenbewertungen lässt sich jede individuelle Bewertung anschließend bearbeiten. Ursprüngliche Gruppennoten bleiben erhalten.</div>`;footer=btnCancel+`<button class="button primary" data-submit="new-assessment">${ico('plus',16)} Anlegen</button>`}
 else if(mode==='edit-assessment'){const a=data.assessments.find(x=>x.id===ui.activeAssessment);title=esc(a?.title||'Leistungsnachweis');wide=' wide';const sy=system(),range=limits(sy);body=`<div class="row between"><span class="pill blue">${esc(typeLabels[a?.type]||'Zusatzleistung')}</span><span class="pill">${a?.groupMode?'Gruppenbewertung · Ausgangsnote '+a.groupGrade:'Einzelbewertung'}</span></div><div class="table-scroll"><table class="fancy-table"><thead><tr><th>Schüler:in</th><th>Bewertung</th></tr></thead><tbody>${studentsFor(ui.classId).filter(st=>Object.hasOwn(a.values,st.id)).map(st=>`<tr><td>${esc(st.code)}</td><td><select aria-label="Bewertung ${esc(st.code)}" data-ass-grade="${st.id}" class="select" style="max-width:180px"><option value="">Noch nicht bewertet</option>${Array.from({length:range.max-range.min+1},(_,i)=>i+range.min).map(n=>`<option value="${n}" ${a.values[st.id]===n?'selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>${a.groupMode?`<div class="notice">Gruppennote ursprünglich: ${a.groupGrade}. Individuelle Anpassungen überschreiben diese Historieninformation nicht.</div>`:''}`;footer=`<button class="button primary" data-close="1">Schließen</button>`}
 else if(mode==='final'){const st=data.students.find(x=>x.id===ui.selectedStudent),range=limits(system()),cur=data.finals[ui.subjectId+':'+st.id];title='Halbjahresnote · '+esc(st?.code);body=`<div class="notice">Rechnerischer Durchschnitt: <b>${avgFormat(calcStudent(st.id,ui.subjectId).avg)}</b>. Die endgültige Note wird manuell festgelegt und bei Änderungen der Bewertungsgrundlage zurückgesetzt.</div><div class="field"><label>Endnote / Punkte</label><select id="modal-final"><option value="">Bitte auswählen</option>${Array.from({length:range.max-range.min+1},(_,i)=>i+range.min).map(n=>`<option value="${n}" ${cur===n?'selected':''}>${n}</option>`).join('')}</select></div>`;footer=btnCancel+`<button class="button primary" data-submit="final">Endnote festlegen</button>`}
 else if(mode==='weighting'){title='Leistungsarten gewichten';body=`<p class="modal-nudge">Die Gewichte müssen zusammen 100 % ergeben. Bestehende Endnoten werden bei einer Änderung zurückgesetzt.</p>${Object.entries(subject().weights).map(([type,w])=>`<div class="field"><label>${esc(typeLabels[type]||type)} (%)</label><input class="weight-field" type="number" min="0" max="100" data-weight="${type}" value="${w}"></div>`).join('')}`;footer=btnCancel+`<button class="button primary" data-submit="weighting">${ico('check',15)} Gewichtung speichern</button>`}
 else if(mode==='audit'){title='Änderungshistorie';wide=' wide';body=`<p class="modal-nudge">Fiktive, lokal erzeugte Demo-Änderungen. Der Produktiv-Audit-Speicher ist hier nicht implementiert.</p><div>${data.audits.slice(0,90).map(a=>`<div class="logrow"><div class="logicon">${ico('clock',15)}</div><div class="flex1"><strong>${esc(a.text)}</strong><p>${auditTime(a.time)} · ${esc(a.entity)}</p></div></div>`).join('')}</div>`;footer=`<button class="button" data-close="1">Schließen</button>`}
 else if(mode==='student'){const st=data.students.find(x=>x.id===ui.selectedStudent);title=esc(st?.code||'Schüler');body=`<div class="row"><div class="class-icon">${ico('users',22)}</div><div><strong>${esc(st?.code||'')}</strong><p class="subtitle">${esc(cls(st?.classId)?.name||'')}</p></div></div><div class="notice">Dieses Kürzel ist nur eine Anzeige. Beziehungen zwischen Schülern und Noten verwenden stabile interne IDs.</div><button class="button" data-open-student-reports="${st?.id}">Zur Auswertung ${ico('arrow',13)}</button>`;footer=btnCancel}
 else if(mode==='reset'){title='Demodaten zurücksetzen?';body=`<div class="notice danger">Alle Änderungen im lokalen Browser werden verworfen und die ursprünglichen fiktiven Daten wiederhergestellt. Dieser Vorgang kann nicht rückgängig gemacht werden.</div>`;footer=btnCancel+`<button class="button danger" data-submit="reset">Demo zurücksetzen</button>`}
 else return '';
 return `<div class="modal-backdrop" id="modal-backdrop"><div class="modal${wide}" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div class="modal-header"><h2 id="modal-heading">${title}</h2>${close}</div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div></div>`}
function render(){let main={dashboard:renderDashboard,classes:renderClasses,lessons:renderLessons,assessments:renderAssessments,reports:renderReports,backups:renderBackups,settings:renderSettings}[ui.page]||renderDashboard;$('#root').innerHTML=shell(main());}
function syncContext(classId,subjectId,lessonId){if(classId&&cls(classId))ui.classId=classId;if(subjectId&&sub(subjectId)&&sub(subjectId).classId===ui.classId)ui.subjectId=subjectId;else if(!subject()||subject().classId!==ui.classId)ui.subjectId=data.subjects.find(s=>s.classId===ui.classId)?.id||'';if(lessonId&&lesson(lessonId)&&lesson(lessonId).subjectId===ui.subjectId)ui.lessonId=lessonId;else if(!activeLesson()||activeLesson().subjectId!==ui.subjectId)ui.lessonId=lessonsFor(ui.subjectId)[0]?.id||'';ui.search='';ui.filter='all';}
function showModal(kind){ui.modal=kind;render();}
function submit(kind){if(kind==='new-student'){const id=$('#modal-class').value,code=$('#modal-code').value.trim().toUpperCase();if(!code||code.length>40)return toast('Bitte ein gültiges Kürzel eingeben');if(studentsFor(id).some(s=>s.code.toLowerCase()===code.toLowerCase()))return toast('Kürzel ist in dieser Klasse bereits vergeben');data.students.push({id:unique('st'),classId:id,code});record('Fiktiven Schüler '+code+' hinzugefügt',null,data.subjects.find(s=>s.classId===id)?.id);ui.modal=null;persist();render();toast('Schüler hinzugefügt');return}
 if(kind==='new-lesson'){const id=$('#modal-subject').value,title=$('#modal-title').value.trim(),date=$('#modal-date').value,dur=Number($('#modal-duration').value),gr=Number($('#modal-default').value),su=sub(id);if(!su||!title||!date||!Number.isInteger(dur)||dur<1||dur>600||!Number.isInteger(gr)||gr<limits(cls(su.classId).system).min||gr>limits(cls(su.classId).system).max)return toast('Bitte Unterrichtsdaten prüfen');const l={id:unique('l'),subjectId:id,date,time:'08:00',duration:dur,title,status:'ACTIVE',defaultGrade:gr};data.lessons.push(l);for(const s of studentsFor(su.classId)){data.attendance[notesKey(l.id,s.id)]='PRESENT';data.grades[notesKey(l.id,s.id)]={value:gr,source:'AUTOMATIC_DEFAULT',note:''}}record('Unterrichtseinheit „'+title+'“ gestartet',null,id);syncContext(su.classId,id,l.id);ui.modal=null;ui.page='lessons';persist();render();toast('Unterricht gestartet · Standardnoten gespeichert');return}
 if(kind==='note'){const key=notesKey(ui.lessonId,ui.selectedStudent),text=$('#modal-note').value;data.notes[key]=text;if(data.grades[key])data.grades[key].note=text;record('Individuelle Unterrichtsnotiz aktualisiert',ui.selectedStudent,ui.subjectId);ui.modal=null;persist();render();toast('Notiz gespeichert');return}
 if(kind==='new-assessment'){const type=$('#modal-type').value,lid=$('#modal-lesson').value,title=$('#modal-title').value.trim(),mode=$('#modal-ass-mode').value,init=Number($('#modal-ass-grade').value),chosen=[...document.querySelectorAll('.ass-student:checked')].map(x=>x.value),lim=limits(system());if(!title||!lesson(lid)||!chosen.length)return toast('Bitte Titel und Teilnehmer auswählen');if(mode!=='unrated'&&(!Number.isInteger(init)||init<lim.min||init>lim.max))return toast('Ungültige Ausgangsnote');const values=Object.fromEntries(chosen.map(id=>[id,mode==='unrated'?null:init]));const a={id:unique('x'),subjectId:ui.subjectId,lessonId:lid,date:lesson(lid).date,title,type,groupMode:mode==='group',groupGrade:mode==='group'?init:null,values};data.assessments.push(a);chosen.forEach(sid=>invalidate(sid,ui.subjectId));record('Zusatzleistung „'+title+'“ angelegt',null,ui.subjectId);ui.page='assessments';ui.modal=null;persist();render();toast('Zusatzleistung erstellt');return}
 if(kind==='final'){const v=$('#modal-final').value,range=limits(system());if(v===''||Number(v)<range.min||Number(v)>range.max)return toast('Bitte gültige Endnote auswählen');data.finals[ui.subjectId+':'+ui.selectedStudent]=Number(v);record('Endnote '+v+' festgelegt',ui.selectedStudent,ui.subjectId);ui.modal=null;persist();render();toast('Endnote manuell festgelegt');return}
 if(kind==='weighting'){const w={},els=[...document.querySelectorAll('[data-weight]')];els.forEach(el=>w[el.dataset.weight]=Number(el.value));const total=Object.values(w).reduce((a,b)=>a+b,0);if(total!==100||Object.values(w).some(x=>!Number.isInteger(x)||x<0))return toast('Gewichtungen müssen genau 100 % ergeben');subject().weights=w;for(const key of Object.keys(data.finals))if(key.startsWith(ui.subjectId+':')){const old=data.finals[key];delete data.finals[key];record('Manuelle Endnote '+old+' nach Gewichtungsänderung zurückgesetzt',key.split(':')[1],ui.subjectId)}record('Fachgewichtung geändert',null,ui.subjectId);ui.modal=null;persist();render();toast('Gewichtung gespeichert');return}
 if(kind==='reset'){data=seed();ui={page:'dashboard',classId:'c1',subjectId:'s1',lessonId:'l1',view:'tiles',filter:'all',search:'',modal:null,activeAssessment:null,selectedStudent:null,reportStudent:null};persist();render();toast('Demodaten wiederhergestellt');return}}
function onClick(e){const el=e.target.closest('button,[data-open-subject],[data-open-class],[data-student-details],[data-report-student]');if(!el)return;const d=el.dataset;
 if(d.page){navigate(d.page);return}if(d.modal){showModal(d.modal);return}if(d.close){ui.modal=null;render();return}if(d.reset){showModal('reset');return}if(d.submit){submit(d.submit);return}
 if(d.openClass){syncContext(d.openClass);ui.page='classes';render();document.getElementById('class-list-'+d.openClass)?.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(d.openSubject){const su=sub(d.openSubject);syncContext(su.classId,su.id);ui.page='lessons';render();return}
 if(d.openLesson){const l=lesson(d.openLesson),su=sub(l.subjectId);syncContext(su.classId,su.id,l.id);ui.page='lessons';render();return}
 if(d.toggleLesson){const l=lesson(d.toggleLesson);l.status=l.status==='ACTIVE'?'COMPLETED':'ACTIVE';record('Unterrichtseinheit '+(l.status==='ACTIVE'?'wieder geöffnet':'abgeschlossen'),null,l.subjectId);persist();render();toast('Unterrichtsstatus gespeichert');return}
 if(d.view){ui.view=d.view;render();return}if(d.filter){ui.filter=d.filter;render();return}if(d.changeGrade){const sid=d.changeGrade,g=getGrade(ui.lessonId,sid);if(g)changeGrade(ui.lessonId,sid,g.value+Number(d.delta));return}
 if(d.cycleAtt){ui.selectedStudent=d.cycleAtt;showModal('attendance');return}if(d.selectAtt){setAtt(ui.lessonId,ui.selectedStudent,d.selectAtt);ui.modal=null;render();return}
 if(d.chooseGrade){ui.selectedStudent=d.chooseGrade;showModal('grade');return}if(d.setGrade){changeGrade(ui.lessonId,ui.selectedStudent,Number(d.setGrade));ui.modal=null;render();return}
 if(d.note){ui.selectedStudent=d.note;showModal('note');return}if(d.editAssessment){ui.activeAssessment=d.editAssessment;showModal('edit-assessment');return}
 if(d.finalStudent){ui.selectedStudent=d.finalStudent;showModal('final');return}if(d.reportStudent){ui.reportStudent=d.reportStudent;render();return}
 if(d.viewAudit){showModal('audit');return}if(d.studentDetails){ui.selectedStudent=d.studentDetails;showModal('student');return}if(d.openStudentReports){const st=data.students.find(s=>s.id===d.openStudentReports);syncContext(st.classId);ui.reportStudent=st.id;ui.modal=null;ui.page='reports';render();return}
}
function onChange(e){const t=e.target;if(t.dataset.control==='class'){syncContext(t.value);render();return}if(t.dataset.control==='subject'){syncContext(ui.classId,t.value);render();return}if(t.dataset.control==='lesson'){syncContext(ui.classId,ui.subjectId,t.value);render();return}
 if(t.dataset.control==='default-grade'){subject().defaultGrade=Number(t.value);record('Standardnote des Fachs angepasst',null,ui.subjectId);persist();render();toast('Standardbewertung geändert');return}
 if(t.dataset.assGrade){const a=data.assessments.find(x=>x.id===ui.activeAssessment),sid=t.dataset.assGrade,v=t.value===''?null:Number(t.value);a.values[sid]=v;record('Zusatzleistung „'+a.title+'“ für '+data.students.find(x=>x.id===sid).code+' geändert',sid,a.subjectId);invalidate(sid,a.subjectId);persist();render();toast('Zusatznote gespeichert');return}
 if(t.id==='modal-class'&&ui.modal==='new-lesson'){const select=$('#modal-subject');select.innerHTML=data.subjects.filter(s=>s.classId===t.value).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('#modal-default').value=String(sub(select.value)?.defaultGrade??3);const range=limits(cls(t.value).system);$('#modal-default').min=range.min;$('#modal-default').max=range.max;return}
 if(t.id==='modal-subject'&&ui.modal==='new-lesson'){$('#modal-default').value=String(sub(t.value)?.defaultGrade??3);return}
 if(t.id==='modal-type'&&ui.modal==='new-assessment'&&t.value==='EXAM'&&$('#modal-title').value==='Neue Präsentation'){$('#modal-title').value='Neue Klassenarbeit';return}
}
function onInput(e){const t=e.target;if(t.dataset.control!=='search')return;const selection=t.selectionStart;ui.search=t.value;render();const input=$('#search-student');if(input){input.focus();try{input.setSelectionRange(selection,selection)}catch{}}}
window.addEventListener('click',onClick);window.addEventListener('change',onChange);window.addEventListener('input',onInput);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});window.addEventListener('click',e=>{if(e.target.id==='modal-backdrop'){ui.modal=null;render()}});
render();
})();
</script>
